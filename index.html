  <meta charset="UTF-8">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b">
  <title>AUDash</title>
  <link rel="icon" href="/favicon.ico" type="image/jpeg">
  <script>
    // Apply the saved/system theme before React loads, so the page doesn't flash.
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root">
    <!-- Static header shown while the app's JavaScript loads (React replaces it). -->
    <div class="app">
      <header class="navbar">
        <div class="navbar-inner">
          <div class="wordmark"><span class="wordmark-strong">AUD</span><span class="wordmark-light">ash</span></div>
        </div>
      </header>
      <main class="main"></main>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
